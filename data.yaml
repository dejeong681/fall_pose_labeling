# images/val/이름.jpg   -> labels/val/이름.txt
# train과 val 양쪽에 낙상/비낙상을 포함하고, 같은 원본에서 나온 자료는 같은 쪽에 묶습니다.

# path: C:/Yt/fall_pose_labeling
# train: images/train
# val: images/val

names:
  0: fall
  1: not fall
