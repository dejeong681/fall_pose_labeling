# YOLO 바운딩박스 탐지 학습용 설정
# 현재 원본 이미지: nas/낙상데이터, nas/비낙상데이터
# 현재 변환된 비낙상 라벨: labels/not_fall
# 아래 train/val 폴더는 아직 없습니다. 학습 전에 이미지와 TXT를 짝지어 배치하세요.
